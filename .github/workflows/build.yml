name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signaturschlüssel erzeugen (nur beim allerersten Mal)
        run: |
          if [ ! -f app/signing/keystore.b64 ]; then
            mkdir -p app/signing
            keytool -genkeypair -keystore /tmp/audiomix.jks -storepass audiomix123 -keypass audiomix123 -alias audiomix -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=AudioMix, O=Privat, C=DE"
            base64 -w 0 /tmp/audiomix.jks > app/signing/keystore.b64
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/signing/keystore.b64
            git commit -m "Signaturschluessel hinzugefuegt"
            git push
          fi

      - name: Schlüssel entpacken
        run: base64 -d app/signing/keystore.b64 > app/signing/audiomix.jks

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK erstellen
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
